<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#171329">
    <meta name="description" content="A little birthday surprise made with love.">

    <title>A Little World For You ✨</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap"
        rel="stylesheet">

    <!-- Global Styles -->
    <link rel="stylesheet" href="./css/common.css">

    <!-- Welcome Page Styles -->
    <link rel="stylesheet" href="./css/welcome.css">

    <!-- Welcome Page Script -->
    <script src="js/welcome.js" defer></script>
</head>

<body>

    <main class="welcome-page">

        <!-- Animated Background -->
        <div class="stars-container" id="starsContainer"></div>

        <div class="ambient-glow ambient-glow-one"></div>
        <div class="ambient-glow ambient-glow-two"></div>

        <!-- Main Content -->
        <section class="welcome-content">

            <div class="moon-wrapper">
                <div class="moon">
                    <div class="moon-crater crater-one"></div>
                    <div class="moon-crater crater-two"></div>
                    <div class="moon-crater crater-three"></div>
                </div>
            </div>

            <p class="welcome-label">
                A LITTLE SURPRISE FOR SOMEONE SPECIAL
            </p>

            <h1 class="welcome-title">
                A Little World
                <span>Made Just For You</span>
            </h1>

            <p class="welcome-description">
                Somewhere between all the stars,
                there is a little world that belongs to you.
                And today, I made something special for you.
            </p>

            <a href="/surprise.html" class="start-button" id="startButton">
                <span>Let's Begin</span>
                <span class="button-icon">✦</span>
            </a>

            <p class="welcome-footer">
                MADE WITH LOVE, JUST FOR YOU
                <span>♥</span>
            </p>

        </section>

        <!-- Decorative Bottom -->
        <div class="bottom-decoration">
            <span>✧</span>
            <span>✦</span>
            <span>✧</span>
        </div>

    </main>

</body>

</html>
